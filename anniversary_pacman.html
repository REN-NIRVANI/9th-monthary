<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Happy 9th Month Baby Girl 🌼</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Press+Start+2P&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Nunito',sans-serif;overflow:hidden;}
#startScreen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px;text-align:center;padding:24px;}
.pixel-title{font-family:'Press Start 2P',monospace;font-size:clamp(14px,4vw,28px);color:#FFD700;line-height:1.6;animation:glow 1.5s ease-in-out infinite alternate;}
@keyframes glow{from{text-shadow:0 0 10px #FFD700;}to{text-shadow:0 0 30px #FFD700,0 0 60px #FF8C00;}}
.pixel-sub{font-family:'Press Start 2P',monospace;font-size:clamp(7px,2vw,11px);color:#fff;line-height:1.9;opacity:.85;}
.hint{font-family:'Caveat',cursive;font-size:clamp(16px,4vw,22px);color:#FFD700;animation:blink 1.2s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.start-btn,.more-btn{background:#FFD700;color:#000;font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.5vw,13px);padding:14px 30px;border:none;border-radius:8px;cursor:pointer;box-shadow:0 4px 0 #b8860b;text-decoration:none;display:inline-block;}
.start-btn:active,.more-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b;}
.pacman-preview{font-size:48px;}
#gameWrap{display:none;flex-direction:column;align-items:center;}
canvas{display:block;touch-action:none;background:#000;}
#hud{font-family:'Press Start 2P',monospace;font-size:clamp(7px,1.8vw,11px);color:#fff;padding:8px 6px;display:flex;justify-content:space-between;}
.lives-display{color:#FFD700;}
#mobileCtrl{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;user-select:none;touch-action:none;}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);gap:4px;}
.dpad button{background:rgba(255,215,0,.18);border:2px solid rgba(255,215,0,.5);border-radius:10px;color:#FFD700;font-size:20px;touch-action:none;}
.dpad button:active{background:rgba(255,215,0,.5);}
@media(max-width:600px),(pointer:coarse){#mobileCtrl{display:block;}}

/* WIN — daisy & lavender */
#winOverlay{display:none;position:fixed;inset:0;z-index:200;overflow-y:auto;padding:28px 14px 50px;
  background:radial-gradient(circle at 20% 10%,#fff8dc 0,transparent 45%),linear-gradient(160deg,#f1e8ff,#fdf6ff 50%,#e9dcff);}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.petals svg{position:absolute;top:-60px;animation:fall linear infinite;}
@keyframes fall{to{transform:translate(var(--sw),115vh) rotate(360deg);}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;text-align:center;}
.win-title{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(34px,9vw,54px);color:#7b5ea7;line-height:1.05;}
.win-title small{display:block;font-size:.5em;color:#c99a00;}
.chip{display:inline-block;margin:10px 0 22px;padding:6px 16px;border-radius:99px;background:#fff;border:2px dashed #b79be0;color:#7b5ea7;font-family:'Caveat',cursive;font-size:20px;font-weight:600;}
.card{position:relative;background:#fffdf8;border:3px solid #d9c8f5;border-radius:26px;padding:34px clamp(18px,5vw,34px) 26px;box-shadow:0 10px 30px rgba(123,94,167,.25);text-align:left;}
.card>.corner{position:absolute;width:86px;height:86px;}
.c1{top:-30px;left:-22px;}.c2{top:-30px;right:-22px;transform:scaleX(-1);}.c3{bottom:-30px;left:-22px;transform:scaleY(-1);}.c4{bottom:-30px;right:-22px;transform:scale(-1);}
.msg{font-family:'Caveat',cursive;font-size:clamp(20px,5vw,25px);color:#4a3a63;line-height:1.55;margin:0 0 14px;opacity:0;transform:translateY(14px);transition:.7s;}
.msg.in,.polas.in,.div.in{opacity:1;transform:none;}
.msg em{color:#8a5fc9;font-style:normal;font-weight:700;background:linear-gradient(transparent 62%,#fff0a8 62%);}
.div{display:flex;justify-content:center;gap:2px;margin:6px 0 16px;opacity:0;transition:.7s;}
.div svg{width:34px;height:40px;}
.polas{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:8px 0 22px;opacity:0;transition:.7s;}
.pola{position:relative;width:44%;min-width:135px;background:#fff;padding:8px 8px 4px;box-shadow:0 4px 12px rgba(0,0,0,.18);transform:rotate(-3deg);}
.pola:nth-child(even){transform:rotate(3deg);}
.pola .tape{position:absolute;top:-16px;left:50%;width:34px;height:34px;margin-left:-17px;}
.pola label{display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:#f3ebff;color:#a68bd3;font-size:13px;text-align:center;cursor:pointer;overflow:hidden;}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.pola figcaption{font-family:'Caveat',cursive;font-size:19px;color:#7b5ea7;text-align:center;padding-top:2px;}
.win-sign{font-family:'Caveat',cursive;font-size:clamp(28px,7vw,38px);color:#8a5fc9;text-align:center;font-weight:700;margin-top:10px;}
.more-btn{margin-top:26px;background:#b79be0;color:#fff;box-shadow:0 4px 0 #7b5ea7;}
.fw{position:fixed;pointer-events:none;z-index:300;border-radius:50%;animation:fwfly 1s ease-out forwards;}
@keyframes fwfly{to{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}}
</style>
</head>

// ═════ WIN SCREEN BUILD ═════
function fl(){return '<svg viewBox="0 0 40 60"><use href="#lav" x="0" y="0" width="20" height="60"/><use href="#daisy" x="8" y="18" width="30" height="30"/></svg>';}
let photoIdx=0;
function polas(){
  let h='<div class="polas">';
  for(let i=0;i<3;i++){
    const p=PHOTOS[photoIdx++];
    h+='<figure class="pola"><svg class="tape"><use href="#daisy"/></svg>'+
      (p?'<img src="'+p.src+'" alt="">':'<label>📸 tap to add<br>our photo<input type="file" accept="image/*" hidden></label>')+
      '<figcaption>'+(p&&p.cap||'us 💜')+'</figcaption></figure>';
  }
  return h+'</div>';
}
function buildStory(){
  photoIdx=0;
  const box=document.getElementById('story');
  box.innerHTML=STORY.map(t=>t==='PHOTOS'?'<div class="div">'+fl()+fl()+fl()+'</div>'+polas():'<p class="msg">'+t+'</p>').join('');
  box.querySelectorAll('input[type=file]').forEach(inp=>inp.addEventListener('change',()=>{
    const f=inp.files[0]; if(!f)return;
    const img=new Image(); img.src=URL.createObjectURL(f); inp.parentNode.replaceWith(img);
  }));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{root:document.getElementById('winOverlay'),threshold:.15});
  box.querySelectorAll('.msg,.polas,.div').forEach(n=>io.observe(n));
}
function petals(){
  const p=document.getElementById('petals');let h='';
  for(let i=0;i<16;i++){
    const s=20+Math.random()*22;
    h+=`<svg width="${s}" height="${s*(i%3?1:1.6)}" style="left:${Math.random()*100}%;animation-duration:${9+Math.random()*9}s;animation-delay:-${Math.random()*12}s;--sw:${(Math.random()-.5)*160}px;opacity:.85"><use href="#${i%3?'daisy':'lav'}"/></svg>`;
  }
  p.innerHTML=h;
}

];
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
cv.width=COLS*T*S;cv.height=ROWS*T*S;
const hud=document.getElementById('hud');
function fit(){
  const coarse=matchMedia('(pointer:coarse)').matches||innerWidth<600;
  const h=innerHeight-40-(coarse?170:10);
  const w=Math.max(200,Math.min(innerWidth-8,h*COLS/ROWS,620));
  cv.style.width=w+'px';cv.style.height=(w*ROWS/COLS)+'px';hud.style.width=w+'px';
}
addEventListener('resize',fit);

// pre-rendered maze (clean neon outline, drawn once)
const mz=document.createElement('canvas');mz.width=cv.width;mz.height=cv.height;
(function(){
  const g=mz.getContext('2d');g.scale(S,S);
  g.fillStyle='#000';g.fillRect(0,0,COLS*T,ROWS*T);
  const W=(c,r)=>r<0||r>=ROWS||c<0||c>=COLS||M[r][c]==='#';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(M[r][c]==='#'){g.fillStyle='#080830';g.fillRect(c*T,r*T,T,T);}
  g.strokeStyle='#3d4dff';g.lineWidth=1.6;g.lineCap='round';g.shadowColor='#3d4dff';g.shadowBlur=4;
  g.beginPath();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(M[r][c]==='#'){
    const x=c*T,y=r*T;
    if(!W(c,r-1)&&r>0){g.moveTo(x,y+.8);g.lineTo(x+T,y+.8);}
    if(!W(c,r+1)&&r<ROWS-1){g.moveTo(x,y+T-.8);g.lineTo(x+T,y+T-.8);}
    if(!W(c-1,r)&&c>0){g.moveTo(x+.8,y);g.lineTo(x+.8,y+T);}
    if(!W(c+1,r)&&c<COLS-1){g.moveTo(x+T-.8,y);g.lineTo(x+T-.8,y+T);}
  }
  g.stroke();
})();

let dots,total,eaten,score,lives,fright,frame,state,freeze,running=false,last=0,acc=0;
let want={x:-1,y:0};
const pac={x:0,y:0,dx:-1,dy:0,moving:true,inv:0};
const D=[[1,0],[-1,0],[0,1],[0,-1]];
const G=[
 {col:'#FF3030',sx:13,sy:11,spd:.8,chase:.95,wait:0},
 {col:'#FFB8FF',sx:14,sy:11,spd:.75,chase:.7,wait:150},
 {col:'#00E5FF',sx:13,sy:13,spd:.72,chase:.55,wait:300},
 {col:'#FFB852',sx:14,sy:13,spd:.7,chase:.4,wait:450}
];
const pass=(c,r,p)=>{if(r<0||r>=ROWS||c<0||c>=COLS)return false;const v=M[r][c];return v!=='#'&&!(p&&v===' ');};

function placeAll(){
  pac.x=13*T;pac.y=23*T;pac.dx=-1;pac.dy=0;pac.moving=true;pac.inv=90;want={x:-1,y:0};
  G.forEach((g,i)=>{g.x=g.sx*T;g.y=g.sy*T;g.dx=0;g.dy=-1;g.acc=0;g.out=0;g.wait=i*150;});
  fright=0;
}
function newGame(){
  dots=M.map(r=>[...r].map(ch=>ch==='.'?1:ch==='o'?2:0));
  total=dots.flat().filter(v=>v).length;eaten=0;score=0;lives=3;frame=0;state='play';
  placeAll();hudUpdate();
}
function hudUpdate(){document.getElementById('scoreDisp').textContent=score;document.getElementById('livesDisp').textContent=lives;}

const PS=.75,GS=.75;
function updatePac(){
  if(pac.inv>0)pac.inv--;
  pac.acc=(pac.acc||0)+PS;if(pac.acc<1)return;pac.acc-=1;
  if(want.x===-pac.dx&&want.y===-pac.dy&&(want.x||want.y)){pac.dx=want.x;pac.dy=want.y;pac.moving=true;}
  if(pac.x%T===0&&pac.y%T===0){
    const c=pac.x/T,r=pac.y/T,v=dots[r][c];
    if(v){dots[r][c]=0;eaten++;score+=v===2?50:10;if(v===2)fright=360;hudUpdate();}
    if(pass(c+want.x,r+want.y,true)){pac.dx=want.x;pac.dy=want.y;}
    pac.moving=pass(c+pac.dx,r+pac.dy,true);
  }
  if(pac.moving){pac.x+=pac.dx*2;pac.y+=pac.dy*2;}
}
function updateGhost(g){
  if(g.out>0){g.out--;return;}
  if(g.wait>0){g.wait--;return;}
  g.acc+=(fright>0?.5:g.spd)*GS;if(g.acc<1)return;g.acc-=1;
  if(g.x%T===0&&g.y%T===0){
    const c=g.x/T,r=g.y/T;
    let o=D.filter(d=>!(d[0]===-g.dx&&d[1]===-g.dy)&&pass(c+d[0],r+d[1],false));
    if(!o.length)o=D.filter(d=>pass(c+d[0],r+d[1],false));
    let b=o[Math.floor(Math.random()*o.length)];
    if(fright<=0&&Math.random()<g.chase){
      const pc=Math.round(pac.x/T),pr=Math.round(pac.y/T);let best=1e9;
      o.forEach(d=>{const k=(c+d[0]-pc)**2+(r+d[1]-pr)**2;if(k<best){best=k;b=d;}});
    }
    g.dx=b[0];g.dy=b[1];
  }
  g.x+=g.dx*2;g.y+=g.dy*2;
}
function collide(){
  for(const g of G){
    if(g.out>0||g.wait>0&&false)continue;
    if(Math.hypot(g.x-pac.x,g.y-pac.y)<10){
      if(fright>0){g.out=200;g.x=13*T;g.y=13*T;g.dx=0;g.dy=-1;score+=200;hudUpdate();}
      else if(pac.inv===0){
        lives--;hudUpdate();state=lives<=0?'over':'dead';freeze=50;return;
      }
    }
  }
}
function update(){
  frame++;
  if(state==='dead'){if(--freeze<=0){state='play';placeAll();}return;}
  if(state!=='play')return;
  if(fright>0)fright--;
  updatePac();
  G.forEach(updateGhost);
  collide();
  if(eaten>=total&&state==='play'){state='won';setTimeout(showWin,700);burst();}
}

function drawGhost(g){
  if(g.out>0)return;
  const cx=g.x+8,cy=g.y+8,r=7;
  let col=g.col;
  if(fright>0)col=(fright<90&&Math.floor(frame/8)%2)?'#fff':'#2233dd';
  ctx.fillStyle=col;ctx.beginPath();
  ctx.arc(cx,cy-1,r,Math.PI,0);ctx.lineTo(cx+r,cy+r);
  for(let i=1;i<=6;i++)ctx.lineTo(cx+r-i*r/3,cy+r-(i%2?2.2:0));
  ctx.closePath();ctx.fill();
  if(fright>0){
    ctx.fillStyle='#fff';ctx.fillRect(cx-3.5,cy-3,2,2);ctx.fillRect(cx+1.5,cy-3,2,2);
  }else{
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-2.6,cy-2,2.2,0,7);ctx.arc(cx+2.6,cy-2,2.2,0,7);ctx.fill();
    ctx.fillStyle='#22f';ctx.beginPath();ctx.arc(cx-2.6+g.dx,cy-2+g.dy,1.1,0,7);ctx.arc(cx+2.6+g.dx,cy-2+g.dy,1.1,0,7);ctx.fill();
  }
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(mz,0,0);
  ctx.setTransform(S,0,0,S,0,0);
  const pulse=.6+.4*Math.sin(frame*.15);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const v=dots[r][c];if(!v)continue;
    if(v===1){ctx.fillStyle='#FFE0B2';ctx.fillRect(c*T+6.5,r*T+6.5,3,3);}
    else{ctx.fillStyle='rgba(255,215,0,'+pulse+')';ctx.beginPath();ctx.arc(c*T+8,r*T+8,4.2,0,7);ctx.fill();}
  }
  G.forEach(drawGhost);
  // pac
  const cx=pac.x+8,cy=pac.y+8;
  let m=pac.moving?.06+.2*Math.abs(Math.sin(frame*.3)):.15;
  if(state==='dead'||state==='over')m=Math.min(1,(50-freeze)/50)*.98;
  ctx.globalAlpha=(pac.inv>0&&Math.floor(pac.inv/5)%2)?.4:1;
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.moveTo(cx,cy);
  const a=state==='dead'||state==='over'?-Math.PI/2:Math.atan2(pac.dy,pac.dx);
  ctx.arc(cx,cy,7,a+m*Math.PI,a+(2-m)*Math.PI);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
  if(state==='over'&&freeze<=0){
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,COLS*T,ROWS*T);
    ctx.textAlign='center';ctx.fillStyle='#ff4040';ctx.font="16px 'Press Start 2P',monospace";
    ctx.fillText('GAME OVER',COLS*T/2,ROWS*T/2-8);
    ctx.fillStyle='#fff';ctx.font="7px 'Press Start 2P',monospace";ctx.fillText('tap or press R to retry',COLS*T/2,ROWS*T/2+14);
  }
}
function loop(t){
  if(!running)return;
  acc+=Math.min(t-last,100);last=t;
  while(acc>=1000/60){update();if(state==='over'&&freeze>0)freeze--;acc-=1000/60;}
  draw();requestAnimationFrame(loop);
}
function begin(){newGame();if(!running){running=true;last=performance.now();requestAnimationFrame(loop);}}
function showWin(){
  running=false;buildStory();petals();
  const o=document.getElementById('winOverlay');o.style.display='block';o.scrollTop=0;
}
function burst(){
  const cols=['#FFD700','#fff','#c4a8f0','#a684dd','#ffca28'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div'),an=Math.random()*6.28,d=80+Math.random()*180,sz=5+Math.random()*9;
    el.className='fw';
    el.style.cssText=`left:${20+Math.random()*60}vw;top:${20+Math.random()*50}vh;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};--tx:${Math.cos(an)*d}px;--ty:${Math.sin(an)*d}px;animation-duration:${.8+Math.random()*.8}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1800);
  }
}

// ═════ CONTROLS (buffered, instant response) ═════
const setDir=(x,y)=>{want={x,y};};
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W'){setDir(0,-1);e.preventDefault();}
  else if(k==='ArrowDown'||k==='s'||k==='S'){setDir(0,1);e.preventDefault();}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){setDir(-1,0);e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){setDir(1,0);e.preventDefault();}
  else if((k==='r'||k==='R')&&state==='over')begin();
});
document.querySelectorAll('.dpad button').forEach(b=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();const [x,y]=b.dataset.d.split(',').map(Number);setDir(x,y);
}));
let sx=0,sy=0;
cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
  }
},{passive:true});
cv.addEventListener('click',()=>{if(state==='over')begin();});
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameWrap').style.display='flex';
  fit();begin();
});
</script>
